<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="六扇门是一款由用户定义任务的情报研判工作台。">
  <title>六扇门 · 情报工作台</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#page" data-i18n="跳到主要内容">跳到主要内容</a>
  <header class="home-topbar">
    <a class="brand" href="#home" aria-label="六扇门首页" data-i18n-label="六扇门首页">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <strong data-i18n="六扇门">六扇门</strong>
    </a>
    <div class="home-actions">
      <select class="language-select" aria-label="界面语言" data-i18n-label="界面语言">
        <option value="zh-CN" lang="zh-CN">中文</option>
        <option value="en" lang="en">English</option>
      </select>
      <a class="button home-workbench-link" href="#overview"><span data-i18n="进入工作台">进入工作台</span>
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
      </a>
    </div>
  </header>
  <aside class="sidebar" aria-label="工作台" data-i18n-label="工作台">
    <a class="brand" href="#home" aria-label="六扇门首页" data-i18n-label="六扇门首页">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span><strong data-i18n="六扇门">六扇门</strong><small data-i18n="情报工作台">情报工作台</small></span>
    </a>
    <button class="button new-task" type="button" data-act="create">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> <span data-i18n="新建监测">新建监测</span>
    </button>
    <nav class="navigation" aria-label="主导航" data-i18n-label="主导航">
      <a href="#overview" data-nav="overview"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-1-2V6a2 2 0 0 1 2-2Z"/><path d="M8 9h8m-8 4h5"/></svg> <span data-i18n="Agent 工作台">Agent 工作台</span></a>
      <a href="#inbox" data-nav="inbox"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v13H4zM4 13h4l2 2h4l2-2h4"/></svg> <span data-i18n="今日情报">今日情报</span></a>
      <a href="#events" data-nav="events"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4m0 4h.01"/></svg> <span data-i18n="事件中心">事件中心</span></a>
    </nav>
    <div class="sidebar-rule"></div>
    <nav class="task-nav" id="task-nav" aria-label="监测任务" data-i18n-label="监测任务"></nav>
    <div class="side-footer"><span class="availability"></span><span data-i18n="本地工作区">本地工作区</span></div>
  </aside>
  <button class="nav-scrim" type="button" data-act="close-menu" aria-label="关闭导航" data-i18n-label="关闭导航"></button>
  <div class="shell">
    <header class="topbar">
      <button class="icon-button mobile-toggle" type="button" data-act="menu" aria-label="展开导航" data-i18n-label="展开导航" aria-expanded="false"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div id="crumb" data-i18n="Agent 工作台">Agent 工作台</div>
      <span id="mode" class="mode" data-i18n="本地规则模式">本地规则模式</span>
      <select class="language-select" aria-label="界面语言" data-i18n-label="界面语言">
        <option value="zh-CN" lang="zh-CN">中文</option>
        <option value="en" lang="en">English</option>
      </select>
    </header>
    <main id="page" class="page" tabindex="-1"><p class="loading" data-i18n="正在读取工作区…">正在读取工作区…</p></main>
  </div>
  <dialog id="overlay" class="dialog" aria-labelledby="dialog-title"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
